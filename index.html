<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/cih-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIH Case Study | Life Lessons, Mentorship & IKIGAI</title>
    <meta name="description" content="A weekly Wednesday life-skills and mentorship program run by Community Innovation Hub (CIH). Empowering youth through real-world scenarios, critical thinking, collaboration, and IKIGAI discovery." />
    <meta name="keywords" content="Community Innovation Hub, CIH, Case Study, Mentorship, Life Skills, IKIGAI, Problem Solving, Career, Nigeria, Tech, Youth" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="CIH Case Study | Life Lessons, Mentorship & IKIGAI" />
    <meta property="og:description" content="Engage with real-world scenarios designed to build critical thinking and leadership skills every Wednesday at Community Innovation Hub." />
    <meta property="og:type" content="website" />
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-white text-slate-800 font-sans antialiased selection:bg-brand-orange selection:text-white">
    <div id="root"></div>
    <script>
      // Global error catcher - shows error visually instead of blank page
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.children.length === 0) {
          root.innerHTML = '<div style="padding:40px;font-family:sans-serif;max-width:700px;margin:0 auto"><h2 style="color:#FF6B00">CIH App Error</h2><p style="color:#333">A runtime error occurred. Details:</p><pre style="background:#f5f5f5;padding:16px;border-radius:8px;overflow:auto;font-size:12px">' + (e.message || 'Unknown error') + '\n\nFile: ' + (e.filename || '') + '\nLine: ' + (e.lineno || '') + '</pre><p style="color:#666">Please clear your browser cache (Ctrl+Shift+R) and refresh.</p></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled promise rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
